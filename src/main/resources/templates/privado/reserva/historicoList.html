<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es"
	layout:decorate="~{layout/base}">
<head>


<style>
.timeline-container {
	position: relative;
	padding: 20px 0;
}

.timeline-line {
	position: absolute;
	left: 50%;
	top: 0;
	bottom: 0;
	width: 2px;
	background: #e9ecef;
	margin-left: -1px;
}

.timeline-dot {
	width: 18px;
	height: 18px;
	background: #fff;
	border: 4px solid #0d6efd;
	border-radius: 50%;
	z-index: 1;
}

.card {
	transition: transform 0.2s;
}

.card:hover {
	transform: translateY(-5px);
}

@media ( max-width : 768px) {
	.timeline-line {
		left: 30px;
	}
	.row {
		flex-direction: row !important;
	}
	.col-5 {
		width: 85% !important;
	}
}
</style>

</head>
<body>
	<div layout:fragment="content" class="container py-5">

		<div
			th:replace="~{fragments/breadcrumbs :: breadcrumbs(${breadcrumbs})}"></div>

		<div class="card shadow-lg border-0 rounded-4 p-4">
			<!-- Contenedor para título + acción -->
			<div
				class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
				<!-- Título -->
				<h5 class="mb-0 fw-semibold d-flex align-items-center">
					<i class="bi bi-clock-history text-primary me-2 fs-4"></i> <span
						th:text="#{page.title.privado.reserva}"></span>
				</h5>


			</div>


			<div class="container py-4">
				<div class="timeline-container position-relative">
					<div class="timeline-line"></div>

					<div th:each="historial, iter : ${historico}"
						class="row g-0 align-items-center mb-4"
						th:classappend="${iter.index % 2 == 0 ? 'flex-row-reverse' : ''}">

						<div class="col-1 d-flex justify-content-center">
							<div class="timeline-dot"></div>
						</div>

						<div class="col-5">
							<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
								<div
									class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
									<small class="fw-bold"
										th:text="${#dates.format(historial.fechaModificacion, 'dd/MM/yyyy HH:mm')}"></small>
									<span class="badge bg-light text-primary"
										th:text="${historial.usuarioModificacion}"></span>
								</div>
								<div class="card-body p-3">
									<h6 class="mb-2 text-uppercase fw-bold text-primary"
										th:text="${historial.reservaEstadoNombre}"></h6>
									<hr class="my-2">
									<div class="row small g-2">
										<div class="col-12 text-muted">
											<i class="bi bi-calendar-event me-1"></i> <strong
												th:text="${#temporals.format(historial.fecha, 'dd/MM/yyyy')}"></strong>
											<span class="mx-1">|</span> <i class="bi bi-clock me-1"></i>
											<span
												th:text="${historial.horaInicio + ' - ' + historial.horaFin}"></span>
										</div>
										<div class="col-12 text-secondary">
											<i class="bi bi-building me-1"></i> <span
												th:text="${historial.instalacionNombre}"></span> <span
												class="mx-1">•</span> <span
												th:text="${historial.instalacionSedeNombre}"></span>
										</div>
										<div class="col-12 text-secondary fst-italic">
											<i class="bi bi-tag me-1"></i> <span
												th:text="${historial.instalacionInstalacionTipoNombre}"></span>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="col-1"></div>
					</div>
				</div>
			</div>


			<div class="mt-4">
				<a href="javascript:history.back()"
					class="btn btn-outline-secondary"> <i
					class="bi bi-arrow-left me-2"></i> <span th:text="#{boton.volver}"></span>
				</a>
			</div>

		</div>
	</div>
</body>
</html>
