<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es"
	layout:decorate="~{layout/base}">
<head>

<script>
	document.addEventListener("DOMContentLoaded", function() {
		var popoverTriggerList = [].slice.call(document
				.querySelectorAll('[data-bs-toggle="popover"]'))
		var popoverList = popoverTriggerList.map(function(popoverTriggerEl) {
			return new bootstrap.Popover(popoverTriggerEl, {
				trigger : 'hover focus' // Se abre al pasar el ratón o hacer clic
			})
		});
	});
</script>

</head>
<body>
	<div layout:fragment="content" class="container py-5">

		<div
			th:replace="~{fragments/breadcrumbs :: breadcrumbs(${breadcrumbs})}"></div>

		<div class="card shadow-lg border-0 rounded-4 p-4">
			<!-- Contenedor para título + acción -->
			<div
				class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
				<!-- Título -->
				<h5 class="mb-0 fw-semibold d-flex align-items-center">
					<i class="bi bi-clock-history text-primary me-2 fs-4"></i> <span
						th:text="#{page.title.privado.reserva}"></span>
				</h5>


			</div>

			<!-- Filtro de búsqueda -->
			<div class="card bg-light border-0 shadow-sm mb-4">
				<div class="card-body">
					<form th:action="@{/privado/reserva}" method="get"
						th:object="${filter}" class="row g-3 align-items-center">




						<div class="col-md-4">
							<label for="isbn" class="form-label fw-bold"
								th:text="#{reserva.filter.fecha.desde}"></label>
							<div class="input-group">
								<span class="input-group-text"><i
									class="bi bi-journal-text"></i></span> <input type="date"
									class="form-control" th:field="*{fechaDesde}"
									th:placeholder="#{reserva.filter.fecha.desde}" />
							</div>
						</div>

						<div class="col-md-4">
							<label for="isbn" class="form-label fw-bold"
								th:text="#{reserva.filter.fecha.hasta}"></label>
							<div class="input-group">
								<span class="input-group-text"><i
									class="bi bi-journal-text"></i></span> <input type="date"
									class="form-control" th:field="*{fechaHasta}"
									th:placeholder="#{reserva.filter.fecha.hasta}" />
							</div>
						</div>

						<div class="col-md-4">
							<label for="reservaEstadoId" class="form-label fw-bold"
								th:text="#{reserva.filter.estado}"></label>
							<div class="input-group">
								<span class="input-group-text"><i
									class="bi bi-card-heading"></i></span> <select class="form-select"
									th:field="*{reservaEstadoId}">
									<option th:each="estado : ${listReservaEstado}"
										th:value="${estado.id}" th:text="${estado.nombre}"></option>
								</select>
							</div>
						</div>

						<div class="col-md-4">
							<label for="instalacionTipoId" class="form-label fw-bold"
								th:text="#{reserva.filter.instalacion.tipo}"></label>
							<div class="input-group">
								<span class="input-group-text"><i
									class="bi bi-card-heading"></i></span> <select class="form-select"
									th:field="*{instalacionTipoId}">
									<option th:each="tipo : ${listInstalacionTipo}"
										th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
								</select>
							</div>
						</div>


						<div class="col-md-4 d-flex">
							<button type="submit" class="btn btn-primary me-2">
								<i class="bi bi-search"></i> <span th:text="#{boton.buscar}"></span>
							</button>
							<a th:href="@{/privado/reserva}"
								class="btn btn-outline-secondary me-2"> <i
								class="bi bi-x-circle"></i> <span th:text="#{boton.limpiar}"></span>
							</a>
						</div>


					</form>
				</div>
			</div>




			<div class="table-responsive">
				<table
					class="table table-hover align-middle shadow-sm rounded-3 overflow-hidden">
					<thead class="table-primary">
						<tr>
							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.fecha}, 'fecha')}"></th>
							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.hora.inicio}, 'horaInicio')}"></th>
							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.hora.fin}, 'horaFin')}"></th>

							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.usuario}, 'usuarioCreacion.nombre')}"></th>
							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.empresa}, 'instalacion.sede.empresa.nombre')}"></th>
							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.sede}, 'instalacion.sede.nombre')}"></th>

							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.instalacion}, 'instalacion.nombre')}"></th>
							<th
								th:replace="~{fragments/th-sort :: sort(#{reserva.tabla.estado}, 'reservaEstado.nombre')}"></th>
							<th class="text-center"><i class="bi bi-gear"></i></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="element : ${page.content}">
							<td class="text-muted"
								th:text="${#temporals.format(element.fecha, 'dd/MM/yyyy')}"></td>
							<td class="fw-bold"
								th:text="${#temporals.format(element.horaInicio, 'HH:mm')}"></td>
							<td class="fw-bold"
								th:text="${#temporals.format(element.horaFin, 'HH:mm')}"></td>
							<td class="fw-bold"><a
								class="text-decoration-none text-muted opacity-75"
								th:href="${url}+'&usuarioCreacionId='+${element.usuarioId}">
									<span th:text="${element.usuarioNombre}"></span>
							</a></td>
							<td class="fw-bold"
								th:text="${element.instalacionSedeEmpresaNombre}"></td>
							<td class="fw-bold" th:text="${element.instalacionSedeNombre}"></td>

							<td><span class="text-primary cursor-pointer fw-semibold"
								data-bs-toggle="popover" data-bs-placement="top"
								data-bs-html="true"
								th:data-bs-title="${element.instalacionNombre}"
								th:data-bs-content="'<div class=&quot;small&quot;><div><strong>Tipo:</strong> ' + ${element.instalacionInstalacionTipoNombre} + '</div><div><strong>Sede:</strong> ' + ${element.instalacionSedeNombre} + '</div><div class=&quot;text-muted&quot;><strong>Empresa:</strong> ' + ${element.instalacionSedeEmpresaNombre} + '</div></div>'">
									<span th:text="${element.instalacionNombre}"></span> <i
									class="bi bi-info-circle ms-1 opacity-50"></i>
							</span></td>

							<td><span class="badge rounded-pill border"
								th:classappend="${element.ReservaEstadoCss}"
								th:text="${element.reservaEstadoNombre}"> </span></td>

							<td class="text-center">

								<div th:if="${element.mostrarAprobar}">
									<button type="button"
										class="btn btn-outline-success btn-sm rounded-circle d-inline-flex align-items-center justify-content-center hover-scale"
										style="width: 32px; height: 32px;" data-bs-toggle="modal"
										th:attr="data-bs-target='#confirmarAprobarModal-' + ${element.id}"
										th:title="#{reserva.modal.boton.aprobar}">
										<i class="bi bi-check2"></i>
									</button>

									<div
										th:replace="~{fragments/modals :: modalConfirmacion(
                        'confirmarAprobarModal-' + ${element.id},
                        #{reserva.modal.titulo.aprobar},
                        #{reserva.modal.body.aprobar},
                        @{/privado/reserva/{id}/aprobar(id=${element.id})},
                        #{reserva.modal.boton.aprobar}
                      )}">
									</div>
								</div>
								<div th:if="${element.mostrarDenegar}">
									<button type="button"
										class="btn btn-outline-danger btn-sm rounded-circle d-inline-flex align-items-center justify-content-center hover-scale"
										style="width: 32px; height: 32px;" data-bs-toggle="modal"
										th:attr="data-bs-target='#confirmarDenegarModal-' + ${element.id}"
										th:title="#{reserva.modal.boton.denegar}">
										<i class="bi bi-slash-circle-fill"></i>
									</button>

									<div
										th:replace="~{fragments/modals :: modalConfirmacion(
                        'confirmarDenegarModal-' + ${element.id},
                        #{reserva.modal.titulo.denegar},
                        #{reserva.modal.body.denegar},
                        @{/privado/reserva/{id}/denegar(id=${element.id})},
                        #{reserva.modal.boton.denegar}
                      )}">
									</div>
								</div>
								<div th:if="${element.mostrarCompletar}">
									<button type="button"
										class="btn btn-outline-success btn-sm rounded-circle d-inline-flex align-items-center justify-content-center hover-scale"
										style="width: 32px; height: 32px;" data-bs-toggle="modal"
										th:attr="data-bs-target='#confirmarCompletarModal-' + ${element.id}"
										th:title="#{reserva.modal.boton.completar}">
										<i class="bi bi-check-lg"></i>
									</button>

									<div
										th:replace="~{fragments/modals :: modalConfirmacion(
                        'confirmarCompletarModal-' + ${element.id},
                        #{reserva.modal.titulo.completar},
                        #{reserva.modal.body.completar},
                        @{/privado/reserva/{id}/completar(id=${element.id})},
                        #{reserva.modal.boton.completar}
                      )}">
									</div>
								</div>

								<div th:if="${element.mostrarIncompletar}">
									<button type="button"
										class="btn btn-outline-warning btn-sm rounded-circle d-inline-flex align-items-center justify-content-center hover-scale"
										style="width: 32px; height: 32px;" data-bs-toggle="modal"
										th:attr="data-bs-target='#confirmarIncompletarModal-' + ${element.id}"
										th:title="#{reserva.modal.boton.incompletar}">
										<i class="bi bi-slash-circle-fill"></i>
									</button>

									<div
										th:replace="~{fragments/modals :: modalConfirmacion(
                        'confirmarIncompletarModal-' + ${element.id},
                        #{reserva.modal.titulo.incompletar},
                        #{reserva.modal.body.incompletar},
                        @{/privado/reserva/{id}/incompletar(id=${element.id})},
                        #{reserva.modal.boton.incompletar}
                      )}">
									</div>
								</div>
								<div th:if="${element.mostrarCancelarPorEmpresa}">
									<button type="button"
										class="btn btn-outline-danger btn-sm rounded-circle d-inline-flex align-items-center justify-content-center hover-scale"
										style="width: 32px; height: 32px;" data-bs-toggle="modal"
										th:attr="data-bs-target='#confirmarCancelarPorEmpresaModal-' + ${element.id}"
										th:title="#{reserva.modal.boton.cancelar.empresa}">
										<i class="bi bi-x-circle-fill"></i>
									</button>

									<div
										th:replace="~{fragments/modals :: modalConfirmacion(
                        'confirmarCancelarPorEmpresaModal-' + ${element.id},
                        #{reserva.modal.titulo.cancelar.empresa},
                        #{reserva.modal.body.cancelar.empresa},
                        @{/privado/reserva/{id}/cancelarempresa(id=${element.id})},
                        #{reserva.modal.boton.cancelar.empresa}
                      )}">
									</div>
								</div>




							</td>
						</tr>

						<tr th:if="${#lists.isEmpty(page.content)}">
							<td colspan="4" class="text-center text-muted py-5"><i
								class="bi bi-search fs-2 d-block mb-2 text-secondary"></i> <span
								th:text="#{tabla.no.se.encontraron.resultados}"></span></td>
						</tr>
					</tbody>
				</table>
			</div>

			<div
				th:replace="~{fragments/pagination :: pagination(${page}, ${url}, ${sort})}"></div>



		</div>
	</div>
</body>
</html>
