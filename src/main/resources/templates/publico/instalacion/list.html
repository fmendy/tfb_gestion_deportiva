<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="es"
	layout:decorate="~{layout/base}">
<head>
<script>
	
</script>
</head>
<body>
	<div layout:fragment="content" class="container py-5">

		<div
			th:replace="~{fragments/breadcrumbs :: breadcrumbs(${breadcrumbs})}"></div>

		<div class="card shadow-lg border-0 rounded-4 p-4">
			<!-- Contenedor para título + acción -->
			<div
				class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
				<!-- Título -->
				<h5 class="mb-0 fw-semibold d-flex align-items-center">
					<i class="bi bi-search text-primary me-2 fs-4"></i> <span
						th:text="#{page.title.publico.instalacion}"></span>
				</h5>
			</div>

			<!-- Filtro de búsqueda -->
			<div class="card bg-light border-0 shadow-sm mb-4 rounded-4">
				<div class="card-body p-4">
					<form th:action="@{/publico/instalacion/buscar}" method="get"
						th:object="${filter}" class="row g-3">

						<!-- Tipo de Instalación -->
						<div class="col-md-4">
							<label for="instalacionTipoId"
								class="form-label fw-semibold text-secondary small"
								th:text="#{instalacion.publico.filter.tipo.instalacion}"></label>
							<span class="text-danger">*</span>
							<div class="input-group">
								<span
									class="input-group-text bg-white border-end-0 rounded-start-3"><i
									class="bi bi-card-heading text-primary"></i></span> <select
									class="form-select border-start-0 rounded-end-3 py-2"
									required="required" th:field="*{instalacionTipoId}">
									<option th:each="instalacion : ${listInstalacionTipo}"
										th:value="${instalacion.id}" th:text="${instalacion.nombre}"></option>
								</select>
							</div>
						</div>

						<!-- Municipio -->
						<div class="col-md-4">
							<label for="municipioId"
								class="form-label fw-semibold text-secondary small"
								th:text="#{instalacion.publico.filter.municipio}"></label> <span
								class="text-danger">*</span>
							<div class="input-group">
								<span
									class="input-group-text bg-white border-end-0 rounded-start-3"><i
									class="bi bi-geo-alt text-primary"></i></span> <select
									class="form-select border-start-0 rounded-end-3 py-2"
									required="required" th:field="*{municipioId}">
									<option th:each="municipio : ${listMunicipio}"
										th:value="${municipio.id}" th:text="${municipio.nombre}"></option>
								</select>
							</div>
						</div>

						<!-- Fecha -->
						<div class="col-md-4">
							<label for="fecha"
								class="form-label fw-semibold text-secondary small"> <span
								th:text="#{instalacion.publico.filter.fecha}">Fecha</span> <span
								class="text-danger">*</span>
							</label>
							<div class="input-group">
								<span
									class="input-group-text bg-white border-end-0 rounded-start-3">
									<i class="bi bi-calendar-event text-primary"></i>
								</span> <input type="date" th:field="*{fecha}" id="fecha"
									required="required"
									class="form-control border-start-0 rounded-end-3 py-2">
							</div>
						</div>

						<!-- Hora de Inicio -->
						<div class="col-md-4">
							<label for="horaInicio"
								class="form-label fw-semibold text-secondary small"> <span
								th:text="#{instalacion.publico.filter.hora}">Inicio</span> <span
								class="text-danger">*</span>
							</label>
							<div class="input-group">
								<span
									class="input-group-text bg-white border-end-0 rounded-start-3">
									<i class="bi bi-clock text-primary"></i>
								</span> <input type="time" th:field="*{horaInicio}" id="horaInicio"
									required="required"
									class="form-control border-start-0 rounded-end-3 py-2">
							</div>
						</div>

						<!-- Botones de Acción (alineados a la derecha o rellenando el espacio) -->
						<div
							class="col-md-8 d-flex align-items-end justify-content-end gap-2 mt-md-0">
							<a th:href="@{/publico/instalacion/buscar}"
								class="btn btn-outline-secondary px-4 py-2 rounded-3"> <i
								class="bi bi-x-circle me-1"></i> <span
								th:text="#{boton.limpiar}"></span>
							</a>
							<button type="submit"
								class="btn btn-primary px-4 py-2 rounded-3 shadow-sm">
								<i class="bi bi-search me-1"></i> <span
									th:text="#{boton.buscar}"></span>
							</button>
						</div>

					</form>
				</div>
			</div>

		</div>

		<!-- Resultados de la Búsqueda -->
		<div class="row g-4 mt-3"
			th:if="${listInstalacion != null and !listInstalacion.empty}">
			<div class="col-md-4" th:each="instalacion : ${listInstalacion}">
				<div class="card h-100 shadow-sm border-0 rounded-4 transition-card">
					<div class="card-body p-4 d-flex flex-column">

						<!-- Tipo de Instalación y Sede -->
						<div class="mb-2">
							<span
								class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1 rounded-pill"
								th:text="${instalacion.instalacionTipoNombre}">Tipo</span>
						</div>

						<!-- Nombre Principal -->
						<h5 class="card-title fw-bold text-dark mb-1"
							th:text="${instalacion.nombre}">Nombre de la Instalación</h5>

						<!-- Empresa y Sede -->
						<p class="text-muted small mb-3">
							<i class="bi bi-building me-1 text-secondary"></i><span
								th:text="${instalacion.empresaNombre}">Empresa</span> <span
								class="mx-1">•</span> <i
								class="bi bi-geo-alt me-1 text-secondary"></i><span
								th:text="${instalacion.sedeNombre}">Sede</span>
						</p>

						<!-- Descripción corta (si existe) -->
						<p class="card-text text-muted small flex-grow-1"
							th:if="${instalacion.descripcion != null}"
							th:text="${#strings.abbreviate(instalacion.descripcion, 100)}">
							Descripción breve...</p>

						<!-- Enlace de Disponibilidad con la fecha del filtro -->
						<div class="mt-3 pt-3 border-top">
							<a
								th:href="@{/publico/instalacion/{id}/disponibilidad(id=${instalacion.id}, fecha=${filter.fecha})}"
								class="btn btn-outline-primary w-100 rounded-3 fw-semibold py-2">
								<i class="bi bi-calendar-check me-2"></i>Ver Disponibilidad
							</a>
						</div>

					</div>
				</div>
			</div>
		</div>

		<!-- Mensaje si no hay resultados -->
		<div
			class="alert alert-info border-0 rounded-4 shadow-sm text-center py-4 mt-4"
			th:if="${listInstalacion != null and listInstalacion.empty}">
			<i class="bi bi-info-circle fs-3 text-primary d-block mb-2"></i>
			<h6 class="fw-bold mb-1">
				<span th:text="#{instalacion.publico.filter.no.resultados.title}"></span>
			</h6>
			<p class="text-muted small mb-0">
				<span th:text="#{instalacion.publico.filter.no.resultados.mensaje}"></span>
			</p>
		</div>
	</div>
</body>
</html>
